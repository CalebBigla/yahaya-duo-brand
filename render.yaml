services:
  - type: web
    name: yahaya-duo-brand
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: bun install && bun run build
    startCommand: bun run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BUN_VERSION
        value: 1.3.14
